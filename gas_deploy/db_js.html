<script>
/* LocalStorage & Google Apps Script Database Service - Version 5
 * Multi-user Safe: Row-level mutations with optimistic locking,
 * client-side image compression, and Google Drive storage.
 */

const DB_KEY = 'PROJECT_DASHBOARD_DB_V5'; // Version 5 for row-level mutations & multi-user support

const DEFAULT_DELIVERABLES = [
  { name: 'Survey Reports', hours: 4, checked: true },
  { name: 'PV Layout', hours: 4, checked: true },
  { name: 'Single Line Diagram', hours: 4, checked: true },
  { name: 'PVSyst Simulation', hours: 4, checked: true },
  { name: 'Bill of Quantities (BOQ)', hours: 4, checked: true },
  { name: 'Load Profile Analysis', hours: 4, checked: true }
];

const DEFAULT_DB = {
  projects: [],
  awardedProjects: [],
  members: [],
  holidays: [],
  manhours: [],
  calendarNotes: []
};

// Stable JSON stringifier helper to avoid order mismatch false-positives
function stableStringify(obj) {
  if (obj === null || typeof obj !== 'object') {
    return JSON.stringify(obj);
  }
  if (Array.isArray(obj)) {
    return '[' + obj.map(stableStringify).join(',') + ']';
  }
  const keys = Object.keys(obj).sort();
  return '{' + keys.map(k => JSON.stringify(k) + ':' + stableStringify(obj[k])).join(',') + '}';
}

class LocalDatabase {
  constructor() {
    this.data = null;
    this.lastSaveTime = 0;
    this.lastWriteTime = 0;
    this.isSaving = false;
    this._syncInterval = null;
    this.init();
    this.startRealtimeSync();
  }

  getGasUrl() {
    const defaultUrl = 'https://script.google.com/macros/s/AKfycbw84DJRu_58sAlno6gKyReHVgp5Q0Jk6433EfWNWT04fOfU-sdzRSZI7lUgN7DoM1mj/exec';
    const legacyDefaultUrl = 'https://script.google.com/macros/s/AKfycbzaeR3Q4NloXjbkQHe2Nv-7AwtzZi7EZ9FTaxK_vOorNS0dhWh_2sOiX97J38zJHi0EUA/exec';
    let url = localStorage.getItem('PROJECT_DASHBOARD_GAS_URL');
    if (url === null || url === legacyDefaultUrl) {
      localStorage.setItem('PROJECT_DASHBOARD_GAS_URL', defaultUrl);
      return defaultUrl;
    }
    return url;
  }

  setGasUrl(url) {
    if (url) {
      localStorage.setItem('PROJECT_DASHBOARD_GAS_URL', url.trim());
    } else {
      localStorage.setItem('PROJECT_DASHBOARD_GAS_URL', '');
    }
  }

  // Initial load
  init() {
    try {
      // 1. Check if database is pre-injected by Google Apps Script template
      const dbElement = document.getElementById('gas-db-json');
      let gasDb = null;
      if (dbElement) {
        try {
          const text = dbElement.textContent.trim();
          if (text && text !== 'null') {
            gasDb = JSON.parse(text);
          }
        } catch (e) {
          console.error('Failed to parse pre-injected database:', e);
        }
      }

      if (gasDb && (gasDb.projects || gasDb.awardedProjects)) {
        this.data = gasDb;
        this.normalizeData();
        localStorage.setItem(DB_KEY, JSON.stringify(this.data));
      } else {
        const stored = localStorage.getItem(DB_KEY);
        if (stored) {
          this.data = JSON.parse(stored);
        } else {
          // Check for legacy V4 data to seamlessly upgrade
          const legacy = localStorage.getItem('PROJECT_DASHBOARD_DB_V4');
          if (legacy) {
            try {
              this.data = JSON.parse(legacy);
            } catch (e) {
              this.data = JSON.parse(JSON.stringify(DEFAULT_DB));
            }
          } else {
            this.data = JSON.parse(JSON.stringify(DEFAULT_DB));
          }
          localStorage.setItem(DB_KEY, JSON.stringify(this.data));
        }
        this.normalizeData();
      }

      const gasUrl = this.getGasUrl();
      if (gasUrl) {
        this.fetchFromServer(gasUrl);
      }
    } catch (e) {
      console.error('Failed to parse database, resetting to default.', e);
      this.data = JSON.parse(JSON.stringify(DEFAULT_DB));
      localStorage.setItem(DB_KEY, JSON.stringify(this.data));
    }
  }

  // In-memory data normalization (strictly in-memory, NEVER writes destructive full saves to server)
  normalizeData() {
    if (!this.data) this.data = JSON.parse(JSON.stringify(DEFAULT_DB));
    if (!this.data.projects) this.data.projects = [];
    if (!this.data.awardedProjects) this.data.awardedProjects = [];
    if (!this.data.members) this.data.members = [];
    if (!this.data.holidays) this.data.holidays = [];
    if (!this.data.manhours) this.data.manhours = [];
    if (!this.data.calendarNotes) this.data.calendarNotes = [];

    const normalizeProject = (p) => {
      // 1. Systems
      if (typeof p.systems === 'string' && p.systems.trim() !== '') {
        try { p.systems = JSON.parse(p.systems); } catch (e) { p.systems = {}; }
      }
      if (!p.systems || typeof p.systems !== 'object') p.systems = {};

      // 2. Deliverables
      if (typeof p.deliverables === 'string' && p.deliverables.trim() !== '') {
        try { p.deliverables = JSON.parse(p.deliverables); } catch (e) { p.deliverables = []; }
      }
      if (!Array.isArray(p.deliverables)) p.deliverables = [];
      if (p.deliverables.length === 0) {
        p.deliverables = JSON.parse(JSON.stringify(DEFAULT_DELIVERABLES));
      }

      // 3. Revisions
      if (typeof p.revisions === 'string' && p.revisions.trim() !== '') {
        try { p.revisions = JSON.parse(p.revisions); } catch (e) { p.revisions = []; }
      }
      if (!Array.isArray(p.revisions)) p.revisions = [];

      // 3b. Map Drawings
      if (typeof p.mapDrawings === 'string' && p.mapDrawings.trim() !== '') {
        try { p.mapDrawings = JSON.parse(p.mapDrawings); } catch (e) { p.mapDrawings = []; }
      }
      if (!Array.isArray(p.mapDrawings)) p.mapDrawings = [];

      // 4. Spellings and stages
      if (p.stage === 'Awarded') p.stage = 'Award';
      if (p.stage === 'Underdevelopment') p.stage = 'Underdevelop';
      if (p.stage === 'Cancle') p.stage = 'Cancel';
      if (p.businessType === 'Treading') p.businessType = 'Trading';

      // 5. Solar capacity excluding BESS
      const sysObj = p.systems || {};
      const solarCapacity = Object.entries(sysObj)
        .filter(([sys]) => sys !== 'BESS')
        .reduce((sum, [_, cap]) => sum + (parseFloat(cap) || 0), 0);
      p.capacity = solarCapacity;

      // 6. Coordinates
      if (p.lat === null || p.lat === undefined || p.lat === '' || isNaN(Number(p.lat))) {
        p.lat = null;
      } else {
        p.lat = parseFloat(p.lat);
      }
      if (p.lng === null || p.lng === undefined || p.lng === '' || isNaN(Number(p.lng))) {
        p.lng = null;
      } else {
        p.lng = parseFloat(p.lng);
      }
    };

    this.data.projects.forEach(normalizeProject);
    this.data.awardedProjects.forEach(normalizeProject);

    // Partition projects by stage cleanly
    const pipelineProjects = [];
    const awardedProjects = [];

    this.data.projects.forEach(p => {
      if (p.stage === 'Award') awardedProjects.push(p);
      else pipelineProjects.push(p);
    });
    this.data.awardedProjects.forEach(p => {
      if (p.stage === 'Award') awardedProjects.push(p);
      else pipelineProjects.push(p);
    });

    this.data.projects = pipelineProjects;
    this.data.awardedProjects = awardedProjects;
  }

  // Alias for backward compatibility
  patchAndMigrate() {
    this.normalizeData();
  }

  // Smart background sync: poll server every 30 seconds when tab is active
  startRealtimeSync() {
    if (this._syncInterval) clearInterval(this._syncInterval);
    this._syncInterval = setInterval(() => {
      if (typeof document !== 'undefined' && document.hidden) return;
      if (this.isSaving) return;
      if (this.lastWriteTime && (Date.now() - this.lastWriteTime < 10000)) return;

      const gasUrl = this.getGasUrl();
      if (!gasUrl) return;

      const requestStartTime = Date.now();
      const cacheBuster = `&_t=${Date.now()}`;
      const url = gasUrl.indexOf('?') !== -1 ? `${gasUrl}&action=get${cacheBuster}` : `${gasUrl}?action=get${cacheBuster}`;

      fetch(url, { cache: 'no-store' })
        .then(res => {
          if (!res.ok) throw new Error(`HTTP error ${res.status}`);
          return res.json();
        })
        .then(serverDb => {
          if (this.lastWriteTime && requestStartTime < this.lastWriteTime) {
            return;
          }
          if (serverDb && (serverDb.projects || serverDb.awardedProjects)) {
            const currentStr = stableStringify(this.data);
            const serverStr = stableStringify(serverDb);
            if (currentStr !== serverStr) {
              console.log('Database updated from server, refreshing views...');
              this.data = serverDb;
              this.normalizeData();
              localStorage.setItem(DB_KEY, JSON.stringify(this.data));
              if (window.app && typeof window.app.updateViews === 'function') {
                window.app.updateViews();
              }
            }
          }
        })
        .catch(e => {
          // Background sync non-intrusive error
        });
    }, 30000);
  }

  fetchFromServer(gasUrl, force = false) {
    const requestStartTime = Date.now();
    const cacheBuster = `&_t=${Date.now()}`;
    const url = gasUrl.indexOf('?') !== -1 ? `${gasUrl}&action=get${cacheBuster}` : `${gasUrl}?action=get${cacheBuster}`;
    return fetch(url, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        return res.json();
      })
      .then(serverDb => {
        if (this.lastWriteTime && requestStartTime < this.lastWriteTime) {
          console.log('Discarding fetchFromServer response: newer write occurred locally.');
          return this.data;
        }
        if (serverDb && (serverDb.projects || serverDb.awardedProjects)) {
          const currentStr = stableStringify(this.data);
          const serverStr = stableStringify(serverDb);
          if (force || currentStr !== serverStr) {
            console.log('Database synced from server, updating UI...');
            this.data = serverDb;
            this.normalizeData();
            localStorage.setItem(DB_KEY, JSON.stringify(this.data));
            if (window.app && typeof window.app.updateViews === 'function') {
              window.app.updateViews();
            }
          }
          return serverDb;
        }
        throw new Error('Invalid database object returned from server');
      })
      .catch(e => {
        console.error('Failed to fetch database from GAS API:', e);
        throw e;
      });
  }

  // Row-level mutation dispatcher with optimistic locking
  async _mutate(ops) {
    this.lastWriteTime = Date.now();
    const snapshot = JSON.parse(JSON.stringify(this.data));

    // Optimistic local update
    const now = Date.now();
    ops.forEach(op => {
      if (op.record && !op.record.updatedAt) {
        op.record.updatedAt = now;
      }
    });
    this.normalizeData();
    localStorage.setItem(DB_KEY, JSON.stringify(this.data));

    const gasUrl = this.getGasUrl();
    if (!gasUrl) {
      this.lastSaveTime = Date.now();
      if (window.app && typeof window.app.updateSyncWidgets === 'function') {
        window.app.updateSyncWidgets();
      }
      return true;
    }

    this.isSaving = true;
    if (window.app && typeof window.app.updateSyncWidgets === 'function') {
      window.app.updateSyncWidgets();
    }

    const url = gasUrl.indexOf('?') !== -1 ? `${gasUrl}&action=mutate` : `${gasUrl}?action=mutate`;

    try {
      const res = await fetch(url, {
        method: 'POST',
        body: JSON.stringify({ ops })
      });
      if (!res.ok) throw new Error(`HTTP error ${res.status}`);
      const serverRes = await res.json();

      if (serverRes.status === 'conflict') {
        console.warn('Mutation conflict:', serverRes.message);
        alert('⚠️ ' + serverRes.message);
        if (serverRes.conflictRecord && serverRes.conflictRecord.id) {
          this._replaceLocalRecord(serverRes.conflictRecord);
          this.normalizeData();
          localStorage.setItem(DB_KEY, JSON.stringify(this.data));
          if (window.app && typeof window.app.updateViews === 'function') {
            window.app.updateViews();
          }
        }
        return false;
      }

      if (serverRes.status === 'error') {
        throw new Error(serverRes.message || 'Server error on mutation');
      }

      if (serverRes.status === 'ok' && Array.isArray(serverRes.results)) {
        serverRes.results.forEach(item => {
          if (item.record && item.record.id) {
            this._replaceLocalRecord(item.record, item.table);
          }
        });
        this.normalizeData();
        localStorage.setItem(DB_KEY, JSON.stringify(this.data));
        if (window.app && typeof window.app.updateViews === 'function') {
          window.app.updateViews();
        }
      }
      return true;
    } catch (err) {
      console.error('Failed to sync mutation to server:', err);
      // Revert local snapshot on server error
      this.data = snapshot;
      localStorage.setItem(DB_KEY, JSON.stringify(this.data));
      if (window.app && typeof window.app.updateViews === 'function') {
        window.app.updateViews();
      }
      alert('ไม่สามารถบันทึกข้อมูลไปยัง Google Sheet ได้: ' + err.message);
      return false;
    } finally {
      this.isSaving = false;
      this.lastSaveTime = Date.now();
      if (window.app && typeof window.app.updateSyncWidgets === 'function') {
        window.app.updateSyncWidgets();
      }
    }
  }

  _replaceLocalRecord(record, targetTable) {
    if (!record || !record.id) return;
    if (record.stage) {
      this.data.projects = (this.data.projects || []).filter(p => p.id !== record.id);
      this.data.awardedProjects = (this.data.awardedProjects || []).filter(p => p.id !== record.id);
      if (record.stage === 'Award') {
        this.data.awardedProjects.push(record);
      } else {
        this.data.projects.push(record);
      }
      return;
    }
    const tables = targetTable ? [targetTable] : ['members', 'holidays', 'manhours', 'calendarNotes'];
    tables.forEach(t => {
      if (Array.isArray(this.data[t])) {
        const idx = this.data[t].findIndex(item => item.id === record.id);
        if (idx !== -1) {
          this.data[t][idx] = record;
        } else if (targetTable === t) {
          this.data[t].push(record);
        }
      }
    });
  }

  // Client-side image compression using HTML Canvas
  compressImage(file, maxDimension = 1600, quality = 0.82) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) {
        return reject(new Error('Invalid image file'));
      }
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Upload image to Google Drive via GAS or fallback to compressed Base64
  async uploadImage(file, oldImageUrl = '') {
    const base64Data = await this.compressImage(file);
    const gasUrl = this.getGasUrl();
    if (!gasUrl) {
      return base64Data;
    }
    const cleanFileName = 'proj_' + Date.now() + '_' + (file.name ? file.name.replace(/[^a-zA-Z0-9._-]/g, '_') : 'img.jpg');
    const uploadUrl = gasUrl.indexOf('?') !== -1 ? `${gasUrl}&action=uploadImage` : `${gasUrl}?action=uploadImage`;
    const res = await fetch(uploadUrl, {
      method: 'POST',
      body: JSON.stringify({
        base64: base64Data,
        fileName: cleanFileName,
        oldImageUrl: oldImageUrl || ''
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} from Google Apps Script`);
    const data = await res.json();
    if (data.status === 'error') {
      throw new Error(data.message || 'Image upload failed');
    }
    return data.url;
  }

  // --- Projects CRUD ---
  getProjects() {
    return this.data.projects || [];
  }

  getAwardedProjects() {
    return this.data.awardedProjects || [];
  }

  getProject(id) {
    let p = (this.data.projects || []).find(p => p.id === id);
    if (!p && this.data.awardedProjects) {
      p = this.data.awardedProjects.find(p => p.id === id);
    }
    return p;
  }

  generateNextProjectCode() {
    const yearPrefix = 'G26-';
    const allProjects = [
      ...(this.data.projects || []),
      ...(this.data.awardedProjects || [])
    ];
    const codes = allProjects
      .map(p => p.code)
      .filter(code => code && code.startsWith(yearPrefix));

    let maxNum = 0;
    codes.forEach(c => {
      const numPart = c.split('-')[1];
      if (numPart) {
        const val = parseInt(numPart, 10);
        if (!isNaN(val) && val > maxNum) {
          maxNum = val;
        }
      }
    });

    const nextVal = maxNum + 1;
    return `${yearPrefix}${String(nextVal).padStart(3, '0')}`;
  }

  addProject(project) {
    const newId = 'P-' + String(Date.now()).slice(-6) + String(Math.floor(Math.random() * 90 + 10));
    const projectCode = project.code && project.code.startsWith('G26-') ? project.code : this.generateNextProjectCode();

    const sysObj = project.systems || {};
    const totalCapacity = Object.entries(sysObj)
      .filter(([sys]) => sys !== 'BESS')
      .reduce((sum, [_, cap]) => sum + (parseFloat(cap) || 0), 0);

    const newProject = {
      id: newId,
      code: projectCode,
      name: project.name || 'Unnamed Project',
      region: project.region || 'Central',
      engineer: project.engineer || '',
      businessType: project.businessType === 'Treading' ? 'Trading' : (project.businessType || 'EPC'),
      investor: project.investor || 'Other',
      client: project.client || '',
      systems: sysObj,
      capacity: totalCapacity,
      lat: (project.lat !== null && project.lat !== undefined && !isNaN(project.lat)) ? parseFloat(project.lat) : null,
      lng: (project.lng !== null && project.lng !== undefined && !isNaN(project.lng)) ? parseFloat(project.lng) : null,
      googleMapsLink: project.googleMapsLink || '',
      image: project.image || '',
      deliverables: project.deliverables || JSON.parse(JSON.stringify(DEFAULT_DELIVERABLES)),
      notes: project.notes || '',
      status: project.status || 'Standby',
      stage: project.stage === 'Cancle' ? 'Cancel' : (project.stage || 'Underdevelop'),
      deadline: project.deadline || new Date().toISOString().split('T')[0],
      constructionDate: project.constructionDate || '',
      codDate: project.codDate || '',
      prTest: project.prTest || '',
      pv: project.pv || '',
      inverter: project.inverter || '',
      awardNote: project.awardNote || '',
      revisions: project.revisions || [],
      mapDrawings: Array.isArray(project.mapDrawings) ? project.mapDrawings : [],
      updatedAt: Date.now()
    };

    const isAward = newProject.stage === 'Award';
    if (isAward) {
      if (!this.data.awardedProjects) this.data.awardedProjects = [];
      this.data.awardedProjects.push(newProject);
    } else {
      if (!this.data.projects) this.data.projects = [];
      this.data.projects.push(newProject);
    }

    this._mutate([{
      op: 'upsert',
      table: isAward ? 'awardedProjects' : 'projects',
      record: newProject,
      baseUpdatedAt: null
    }]);

    return newProject;
  }

  updateProject(id, updatedData) {
    let listName = 'projects';
    let idx = (this.data.projects || []).findIndex(p => p.id === id);
    if (idx === -1) {
      if (!this.data.awardedProjects) this.data.awardedProjects = [];
      idx = this.data.awardedProjects.findIndex(p => p.id === id);
      listName = 'awardedProjects';
    }
    if (idx === -1) return false;

    const currentProject = this.data[listName][idx];
    const baseUpdatedAt = currentProject.updatedAt || null;

    const sysObj = updatedData.systems || currentProject.systems || {};
    const totalCapacity = Object.entries(sysObj)
      .filter(([sys]) => sys !== 'BESS')
      .reduce((sum, [_, cap]) => sum + (parseFloat(cap) || 0), 0);

    const updatedProject = {
      ...currentProject,
      ...updatedData,
      systems: sysObj,
      capacity: totalCapacity,
      businessType: updatedData.businessType === 'Treading' ? 'Trading' : (updatedData.businessType || currentProject.businessType),
      stage: updatedData.stage === 'Cancle' ? 'Cancel' : (updatedData.stage || currentProject.stage),
      lat: updatedData.hasOwnProperty('lat') ? (updatedData.lat === null || isNaN(updatedData.lat) ? null : parseFloat(updatedData.lat)) : currentProject.lat,
      lng: updatedData.hasOwnProperty('lng') ? (updatedData.lng === null || isNaN(updatedData.lng) ? null : parseFloat(updatedData.lng)) : currentProject.lng,
      updatedAt: Date.now()
    };

    const oldStage = currentProject.stage;
    const newStage = updatedProject.stage || oldStage;

    if (oldStage === 'Award' && newStage !== 'Award') {
      this.data.awardedProjects.splice(idx, 1);
      if (!this.data.projects) this.data.projects = [];
      this.data.projects.push(updatedProject);
    } else if (oldStage !== 'Award' && newStage === 'Award') {
      this.data.projects.splice(idx, 1);
      if (!this.data.awardedProjects) this.data.awardedProjects = [];
      this.data.awardedProjects.push(updatedProject);
    } else {
      this.data[listName][idx] = updatedProject;
    }

    const targetTable = (newStage === 'Award') ? 'awardedProjects' : 'projects';
    this._mutate([{
      op: 'upsert',
      table: targetTable,
      record: updatedProject,
      baseUpdatedAt: baseUpdatedAt
    }]);

    return updatedProject;
  }

  deleteProject(id) {
    const proj = this.getProject(id);
    if (!proj) return false;

    const isAward = proj.stage === 'Award';
    const baseUpdatedAt = proj.updatedAt || null;

    this.data.projects = (this.data.projects || []).filter(p => p.id !== id);
    if (this.data.awardedProjects) {
      this.data.awardedProjects = this.data.awardedProjects.filter(p => p.id !== id);
    }
    this.data.manhours = (this.data.manhours || []).filter(mh => mh.projectId !== id);

    this._mutate([{
      op: 'delete',
      table: isAward ? 'awardedProjects' : 'projects',
      record: { id: id },
      baseUpdatedAt: baseUpdatedAt
    }]);

    return true;
  }

  // --- Members CRUD ---
  getMembers() {
    return this.data.members || [];
  }

  addMember(name, role) {
    const newId = 'M-' + String(Date.now()).slice(-6) + String(Math.floor(Math.random() * 90 + 10));
    const newMember = { id: newId, name, role, updatedAt: Date.now() };
    if (!this.data.members) this.data.members = [];
    this.data.members.push(newMember);

    this._mutate([{
      op: 'upsert',
      table: 'members',
      record: newMember,
      baseUpdatedAt: null
    }]);

    return newMember;
  }

  deleteMember(id) {
    const member = (this.data.members || []).find(m => m.id === id);
    const baseUpdatedAt = member ? member.updatedAt : null;

    this.data.members = (this.data.members || []).filter(m => m.id !== id);

    const allProjects = [
      ...(this.data.projects || []),
      ...(this.data.awardedProjects || [])
    ];
    allProjects.forEach(p => {
      if (p.engineer === id) {
        p.engineer = '';
      }
    });

    this.data.manhours = (this.data.manhours || []).filter(mh => mh.memberId !== id);

    this._mutate([{
      op: 'delete',
      table: 'members',
      record: { id: id },
      baseUpdatedAt: baseUpdatedAt
    }]);

    return true;
  }

  // --- Holidays CRUD ---
  getHolidays() {
    return this.data.holidays || [];
  }

  addHoliday(date, name) {
    const newId = 'H-' + String(Date.now()).slice(-6) + String(Math.floor(Math.random() * 90 + 10));
    const newHoliday = { id: newId, date, name, updatedAt: Date.now() };
    if (!this.data.holidays) this.data.holidays = [];
    this.data.holidays.push(newHoliday);
    this.data.holidays.sort((a, b) => new Date(a.date) - new Date(b.date));

    this._mutate([{
      op: 'upsert',
      table: 'holidays',
      record: newHoliday,
      baseUpdatedAt: null
    }]);

    return newHoliday;
  }

  deleteHoliday(id) {
    const holiday = (this.data.holidays || []).find(h => h.id === id);
    const baseUpdatedAt = holiday ? holiday.updatedAt : null;

    this.data.holidays = (this.data.holidays || []).filter(h => h.id !== id);

    this._mutate([{
      op: 'delete',
      table: 'holidays',
      record: { id: id },
      baseUpdatedAt: baseUpdatedAt
    }]);

    return true;
  }

  // --- Calendar Notes CRUD ---
  getCalendarNotes() {
    if (!this.data.calendarNotes) this.data.calendarNotes = [];
    return this.data.calendarNotes;
  }

  saveCalendarNote(date, note) {
    if (!this.data.calendarNotes) this.data.calendarNotes = [];
    const idx = this.data.calendarNotes.findIndex(n => n.date === date);

    if (note.trim() === '') {
      if (idx !== -1) {
        const delNote = this.data.calendarNotes[idx];
        this.data.calendarNotes.splice(idx, 1);
        this._mutate([{
          op: 'delete',
          table: 'calendarNotes',
          record: { id: delNote.id },
          baseUpdatedAt: delNote.updatedAt || null
        }]);
      }
    } else {
      if (idx !== -1) {
        const existingNote = this.data.calendarNotes[idx];
        const baseUpdatedAt = existingNote.updatedAt || null;
        existingNote.note = note;
        existingNote.updatedAt = Date.now();
        this._mutate([{
          op: 'upsert',
          table: 'calendarNotes',
          record: existingNote,
          baseUpdatedAt: baseUpdatedAt
        }]);
      } else {
        const newId = 'N-' + String(Date.now()).slice(-6) + String(Math.floor(Math.random() * 90 + 10));
        const newNote = { id: newId, date, note, updatedAt: Date.now() };
        this.data.calendarNotes.push(newNote);
        this._mutate([{
          op: 'upsert',
          table: 'calendarNotes',
          record: newNote,
          baseUpdatedAt: null
        }]);
      }
    }
  }

  // --- Manhours Management ---
  getManhours() {
    return this.data.manhours || [];
  }

  saveManhour(memberId, date, hours, projectId = '', deliverableName = '') {
    if (!this.data.manhours) this.data.manhours = [];
    const entry = this.data.manhours.find(mh => mh.memberId === memberId && mh.date === date && mh.projectId === projectId && (mh.deliverableName || '') === deliverableName);

    if (entry) {
      const baseUpdatedAt = entry.updatedAt || null;
      if (hours <= 0) {
        this.data.manhours = this.data.manhours.filter(mh => mh.id !== entry.id);
        this._mutate([{
          op: 'delete',
          table: 'manhours',
          record: { id: entry.id },
          baseUpdatedAt: baseUpdatedAt
        }]);
      } else {
        entry.hours = parseFloat(hours) || 0;
        entry.updatedAt = Date.now();
        this._mutate([{
          op: 'upsert',
          table: 'manhours',
          record: entry,
          baseUpdatedAt: baseUpdatedAt
        }]);
      }
    } else if (hours > 0) {
      const newId = 'MH-' + String(Date.now()).slice(-6) + String(Math.floor(Math.random() * 90 + 10));
      const newEntry = {
        id: newId,
        memberId,
        date,
        hours: parseFloat(hours) || 0,
        projectId,
        deliverableName,
        updatedAt: Date.now()
      };
      this.data.manhours.push(newEntry);
      this._mutate([{
        op: 'upsert',
        table: 'manhours',
        record: newEntry,
        baseUpdatedAt: null
      }]);
    }
  }

  // Helper: Get weekly hours for all members
  getWeeklyManhoursSummary(startDateStr) {
    const start = new Date(startDateStr);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      days.push(d.toISOString().split('T')[0]);
    }

    const summary = {};
    const members = this.getMembers();

    members.forEach(m => {
      summary[m.id] = {
        memberId: m.id,
        memberName: m.name,
        dailyHours: {},
        weeklyTotal: 0
      };
      days.forEach(day => {
        summary[m.id].dailyHours[day] = 0;
      });
    });

    const manhours = this.getManhours();
    manhours.forEach(mh => {
      if (summary[mh.memberId] && days.includes(mh.date)) {
        summary[mh.memberId].dailyHours[mh.date] += mh.hours;
        summary[mh.memberId].weeklyTotal += mh.hours;
      }
    });

    return {
      days,
      summary: Object.values(summary)
    };
  }

  // --- Export / Import Backup JSON ---
  exportData() {
    return JSON.stringify(this.data, null, 2);
  }

  async importData(jsonStr) {
    try {
      const parsed = JSON.parse(jsonStr);
      if (!parsed || typeof parsed !== 'object') return false;
      if (!(parsed.projects || parsed.awardedProjects) || !parsed.members || !parsed.holidays || !parsed.manhours) {
        return false;
      }

      const gasUrl = this.getGasUrl();
      if (gasUrl) {
        const replaceUrl = gasUrl.indexOf('?') !== -1 ? `${gasUrl}&action=replaceAll` : `${gasUrl}?action=replaceAll`;
        const res = await fetch(replaceUrl, {
          method: 'POST',
          body: JSON.stringify({
            confirm: 'REPLACE_ALL',
            data: parsed
          })
        });
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const result = await res.json();
        if (result.status !== 'ok') {
          throw new Error(result.message || 'Replace failed on server');
        }
      }

      this.data = parsed;
      this.normalizeData();
      localStorage.setItem(DB_KEY, JSON.stringify(this.data));
      return true;
    } catch (e) {
      console.error('Failed to import JSON data', e);
      return false;
    }
  }
}

// Instantiate database globally
const db = new LocalDatabase();
window.db = db;

// Global capacity formatting helpers
window.formatProjectCapacityRow = function(p) {
  let parts = [];
  const solarCap = p.capacity || 0; // already excludes BESS
  if (solarCap > 0) {
    parts.push(`${(solarCap * 1000).toLocaleString(undefined, {maximumFractionDigits: 0})} kWp`);
  }
  if (p.systems && p.systems.BESS && parseFloat(p.systems.BESS) > 0) {
    const bessCap = parseFloat(p.systems.BESS);
    parts.push(`${(bessCap * 1000).toLocaleString(undefined, {maximumFractionDigits: 0})} kWh`);
  }
  return parts.length > 0 ? parts.join(' + ') : '0 kWp';
};

window.formatProjectCapacityMW = function(p) {
  let parts = [];
  const solarCap = p.capacity || 0; // already excludes BESS
  if (solarCap > 0) {
    parts.push(`${solarCap.toFixed(1)} MW`);
  }
  if (p.systems && p.systems.BESS && parseFloat(p.systems.BESS) > 0) {
    const bessCap = parseFloat(p.systems.BESS);
    parts.push(`${bessCap.toFixed(1)} MW (BESS)`);
  }
  return parts.length > 0 ? parts.join(' + ') : '0.0 MW';
};
